<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="200" height="200" fill="transparent"/>
  
  <!-- 身体 -->
  <ellipse cx="100" cy="100" rx="15" ry="25" fill="#704214"/>
  
  <!-- 头部 -->
  <circle cx="100" cy="80" r="10" fill="#704214"/>
  
  <!-- 触角 -->
  <path d="M100 75 C110 65 120 60 125 55" stroke="#704214" stroke-width="2" fill="none"/>
  <path d="M100 75 C90 65 80 60 75 55" stroke="#704214" stroke-width="2" fill="none"/>
  
  <!-- 左前翅 -->
  <path d="M100 95 C70 60 30 80 60 120 C75 150 100 140 100 115" fill="#FFD700" stroke="#6B8E23" stroke-width="1">
    <!-- 翅膀上的斑点 -->
    <circle cx="80" cy="90" r="5" fill="#8B4513"/>
    <circle cx="65" cy="100" r="3" fill="#8B4513"/>
    <circle cx="90" cy="110" r="4" fill="#8B4513"/>
  </path>
  
  <!-- 右前翅 -->
  <path d="M100 95 C130 60 170 80 140 120 C125 150 100 140 100 115" fill="#FFD700" stroke="#6B8E23" stroke-width="1">
    <!-- 翅膀上的斑点 -->
    <circle cx="120" cy="90" r="5" fill="#8B4513"/>
    <circle cx="135" cy="100" r="3" fill="#8B4513"/>
    <circle cx="110" cy="110" r="4" fill="#8B4513"/>
  </path>
  
  <!-- 左后翅 -->
  <path d="M100 115 C80 125 70 160 100 170 C110 160 100 125 100 115" fill="#FFFACD" stroke="#6B8E23" stroke-width="1">
    <circle cx="90" cy="135" r="3" fill="#8B4513"/>
  </path>
  
  <!-- 右后翅 -->
  <path d="M100 115 C120 125 130 160 100 170 C90 160 100 125 100 115" fill="#FFFACD" stroke="#6B8E23" stroke-width="1">
    <circle cx="110" cy="135" r="3" fill="#8B4513"/>
  </path>
  
  <!-- 腿部 -->
  <path d="M100 105 L85 130" stroke="#704214" stroke-width="2"/>
  <path d="M100 110 L80 135" stroke="#704214" stroke-width="2"/>
  <path d="M100 115 L75 140" stroke="#704214" stroke-width="2"/>
  <path d="M100 105 L115 130" stroke="#704214" stroke-width="2"/>
  <path d="M100 110 L120 135" stroke="#704214" stroke-width="2"/>
  <path d="M100 115 L125 140" stroke="#704214" stroke-width="2"/>
</svg>