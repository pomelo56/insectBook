<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="stickInsectBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#778B69" />
      <stop offset="100%" stop-color="#5D6D4F" />
    </linearGradient>
    <linearGradient id="stickInsectLegs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6E7F61" />
      <stop offset="100%" stop-color="#546147" />
    </linearGradient>
  </defs>
  <!-- 身体 -->
  <path d="M100,50 Q120,60 140,50 L140,60 Q120,70 100,60 L100,50 Z" fill="url(#stickInsectBody)" />
  <path d="M100,60 Q120,70 140,60 L140,70 Q120,80 100,70 L100,60 Z" fill="url(#stickInsectBody)" />
  <path d="M100,70 Q120,80 140,70 L140,80 Q120,90 100,80 L100,70 Z" fill="url(#stickInsectBody)" />
  <path d="M100,80 Q120,90 140,80 L140,90 Q120,100 100,90 L100,80 Z" fill="url(#stickInsectBody)" />
  <path d="M100,90 Q120,100 140,90 L140,100 Q120,110 100,100 L100,90 Z" fill="url(#stickInsectBody)" />
  <path d="M100,100 Q120,110 140,100 L140,110 Q120,120 100,110 L100,100 Z" fill="url(#stickInsectBody)" />
  
  <!-- 头部 -->
  <ellipse cx="100" cy="45" rx="8" ry="6" fill="#6E7F61" />
  
  <!-- 眼睛 -->
  <circle cx="95" cy="43" r="2" fill="#333" />
  <circle cx="105" cy="43" r="2" fill="#333" />
  
  <!-- 前腿 -->
  <path d="M90,55 Q80,40 60,45" stroke="url(#stickInsectLegs)" stroke-width="2" fill="none" />
  <path d="M110,55 Q120,40 140,45" stroke="url(#stickInsectLegs)" stroke-width="2" fill="none" />
  
  <!-- 中腿 -->
  <path d="M90,75 Q75,90 60,85" stroke="url(#stickInsectLegs)" stroke-width="2" fill="none" />
  <path d="M110,75 Q125,90 140,85" stroke="url(#stickInsectLegs)" stroke-width="2" fill="none" />
  
  <!-- 后腿 -->
  <path d="M90,105 Q75,130 60,125" stroke="url(#stickInsectLegs)" stroke-width="2" fill="none" />
  <path d="M110,105 Q125,130 140,125" stroke="url(#stickInsectLegs)" stroke-width="2" fill="none" />
  
  <!-- 触角 -->
  <path d="M95,45 Q85,35 80,30" stroke="#546147" stroke-width="1" fill="none" />
  <path d="M105,45 Q115,35 120,30" stroke="#546147" stroke-width="1" fill="none" />
</svg>