<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>insectBook 任务面板</title>
<style>
:root {
  --color-done: #2a9d8f;
  --color-done-bg: #e8f5e9;
  --color-backlog: #e76f51;
  --color-backlog-bg: #fff3e0;
  --color-qa: #7e57c2;
  --color-qa-bg: #f3e5f5;
  --color-p0: #d32f2f;
  --color-p1: #f57c00;
  --color-p2: #78909c;
  --border: #e0e0e0;
  --text: #333;
  --text-secondary: #666;
  --bg: #fafafa;
  --card-bg: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 24px; }
h1 { font-size: 24px; margin-bottom: 4px; }
.subtitle { color: var(--text-secondary); font-size: 14px; margin-bottom: 20px; }
.stats { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
.stat { padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; border: 1px solid var(--border); background: var(--card-bg); }
.stat.done { color: var(--color-done); }
.stat.backlog { color: var(--color-backlog); }
.stat.qa { color: var(--color-qa); }
.board { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.column { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-height: 200px; }
.column-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--border); }
.column-header .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
.column-header .dot.done { background: var(--color-done); }
.column-header .dot.backlog { background: var(--color-backlog); }
.column-header .dot.qa { background: var(--color-qa); }
.column-header h2 { font-size: 16px; }
.column-header .count { font-size: 12px; color: var(--text-secondary); margin-left: auto; }
.card { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 8px; cursor: default; transition: box-shadow 0.2s; }
.card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.card-header { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.card-header .badge { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 4px; color: #fff; }
.card-header .badge.P0 { background: var(--color-p0); }
.card-header .badge.P1 { background: var(--color-p1); }
.card-header .badge.P2 { background: var(--color-p2); }
.card-title { font-size: 14px; font-weight: 600; flex: 1; }
.card-meta { font-size: 11px; color: var(--text-secondary); display: flex; gap: 12px; margin-bottom: 4px; }
.card-notes { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
.card-deps { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }
.card-deps span { background: #eee; padding: 1px 5px; border-radius: 3px; margin-right: 4px; }
.progress-bar { width: 100%; height: 4px; background: #eee; border-radius: 2px; margin-top: 16px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--color-done); border-radius: 2px; transition: width 0.5s; }
.phase-section { margin-bottom: 16px; }
.phase-label { font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px dashed var(--border); }
.empty { text-align: center; color: #ccc; padding: 24px; font-size: 14px; }
</style>
</head>
<body>

<h1>insectBook 重构任务面板</h1>
<p class="subtitle">Phase 0 完成 · Phase 1 进行中 (Loop 1-1 ✓) · 总计 25 项 · <span id="done-count">0</span> 项已完成</p>

<div class="stats" id="stats"></div>

<div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width: 0%"></div></div>

<div class="board" id="board"></div>

<script>
// 数据内嵌 — 无需 fetch, 本地双击即可打开
const TASKS = [
{"id":"P0-L5","title":"清理 vibe coding 遗留","phase":0,"loop":"L5","status":"done","priority":"P0","owner":"主理人","deps":[],"notes":"删除9补丁MD+6补丁SH+2冗余docs"},
{"id":"P0-L1","title":"AI 基础设施 (5 skills + 2 knowledge)","phase":0,"loop":"L1","status":"done","priority":"P0","owner":"架构师+主理人","deps":["P0-L5"],"notes":"loop-engineering/wx-miniprogram/service-split/cloud-devops/design-system + schema/ADR"},
{"id":"P0-L2","title":"架构文档 (ARCHITECTURE.md + ADR)","phase":0,"loop":"L2","status":"done","priority":"P0","owner":"架构师","deps":["P0-L1"],"notes":"目标架构概览、数据流、文件行数目标"},
{"id":"P0-L3","title":"编码约定 (CONVENTIONS.md)","phase":0,"loop":"L3","status":"done","priority":"P0","owner":"主理人","deps":["P0-L2"],"notes":"命名约定、require顺序、Git分支策略、文件行数目标"},
{"id":"P0-L4","title":"测试基础 (jest + wx mock)","phase":0,"loop":"L4","status":"done","priority":"P0","owner":"QA+主理人","deps":["P0-L3"],"notes":"jest.config.js + tests/setup.js + tests/目录"},
{"id":"P1-1","title":"抽离 insectService","phase":1,"loop":"1-1","status":"done","priority":"P0","owner":"工程师 → QA","deps":["P0-L4"],"notes":"index.js 948→794行, insectService.js 173行, 45 tests"},
{"id":"P1-2","title":"抽离 cacheService","phase":1,"loop":"1-2","status":"backlog","priority":"P0","owner":"工程师 → QA","deps":["P1-1"],"notes":"统一缓存读写，替代散布各处的wx.setStorageSync/getStorageSync"},
{"id":"P1-3","title":"抽离 levelService + knowledgeService + adminService","phase":1,"loop":"1-3","status":"backlog","priority":"P0","owner":"工程师 → QA","deps":["P1-2"],"notes":"等级计算+冷知识+管理员权限，从index.js剩余部分拆出"},
{"id":"P1-4","title":"抽离 recognitionService + imageService + saveService","phase":1,"loop":"1-4","status":"backlog","priority":"P1","owner":"工程师 → QA","deps":["P1-3"],"notes":"从camera.js(1189行)拆出识别流程+图片压缩+保存流程"},
{"id":"P1-5","title":"合并云函数 23→3","phase":1,"loop":"1-5","status":"backlog","priority":"P1","owner":"工程师 → QA","deps":["P1-4"],"notes":"insectApi/userApi/adminApi 三类入口，旧函数归档 _archive/"},
{"id":"P1-6","title":"瘦身 Page 文件 + 全量回归","phase":1,"loop":"1-6","status":"backlog","priority":"P1","owner":"工程师 → QA","deps":["P1-5"],"notes":"index.js+camera.js ≤200行目标，全量回归测试"},
{"id":"P2-1","title":"ID 重构 (name→externalId)","phase":2,"loop":"2-1","status":"backlog","priority":"P0","owner":"工程师 → QA","deps":["P1-6"],"notes":"执行insect-id-system-refactor方案，数据迁移+全量查询改为externalId"},
{"id":"P2-2","title":"async/await 全量替换","phase":2,"loop":"2-2","status":"backlog","priority":"P1","owner":"工程师 → QA","deps":["P2-1"],"notes":"替换camera.js 3层回调嵌套，timeoutWrap工具函数"},
{"id":"P2-3","title":"统一状态管理","phase":2,"loop":"2-3","status":"backlog","priority":"P2","owner":"架构师 → 工程师","deps":["P2-2"],"notes":"Behavior+globalData规范，替代散布的setStorageSync"},
{"id":"P2-4","title":"统一错误处理 + 清除补丁依赖","phase":2,"loop":"2-4","status":"backlog","priority":"P1","owner":"工程师 → QA","deps":["P2-3"],"notes":"errorHandler.js + 删除根目录遗留JS工具脚本"},
{"id":"P2-5","title":"design-system token 替换硬编码样式","phase":2,"loop":"2-5","status":"backlog","priority":"P2","owner":"工程师 → QA","deps":["P2-4"],"notes":"颜色/间距/字体从token取值+注释标注，替代硬编码"},
{"id":"DB-BACKUP","title":"导出云数据库快照 (insects + user_insects)","phase":"基础","loop":"-","status":"backlog","priority":"P0","owner":"用户手动","deps":[],"notes":"Loop 2-1 ID重构前必须完成，在微信开发者工具或云函数导出JSON"},
{"id":"P3-1","title":"核心Service单元测试覆盖","phase":3,"loop":"3-1","status":"backlog","priority":"P1","owner":"QA","deps":["P1-6"],"notes":"≥60%核心路径覆盖率"},
{"id":"P3-2","title":"云函数集成测试","phase":3,"loop":"3-2","status":"backlog","priority":"P2","owner":"QA","deps":["P2-1"],"notes":"insectApi/userApi/adminApi 集成测试"},
{"id":"P3-3","title":"E2E 验收","phase":3,"loop":"3-3","status":"backlog","priority":"P2","owner":"QA+主理人","deps":["P3-1","P3-2"],"notes":"拍照识别→保存→首页展示→删除 完整流程"},
{"id":"P3-4","title":"交付验收","phase":3,"loop":"3-4","status":"backlog","priority":"P1","owner":"主理人","deps":["P3-3"],"notes":"全量测试报告+交付总结"},
{"id":"QA-1","title":"index.js 重复进度计算 → 统一委托 Service","phase":1,"loop":"QA-finding","status":"backlog","priority":"P2","owner":"工程师","deps":["P1-1"],"notes":"updateUserLevelWithConfig 内联计算进度，应统一用insectService.calculateProgress"},
{"id":"QA-2","title":"tryRecoverFromCache 存在永不触发的 null-check","phase":1,"loop":"QA-finding","status":"backlog","priority":"P2","owner":"工程师","deps":["P1-1"],"notes":"if (!cacheData) 永不为falsy（始终返回对象）"},
{"id":"QA-3","title":"recoverInsectDataFromCache 读取未使用变量","phase":1,"loop":"QA-finding","status":"backlog","priority":"P2","owner":"工程师","deps":["P1-1"],"notes":"cachedCount 从storage读取后被忽略(改用数组长度)"},
{"id":"QA-4","title":"insectService 173行 > 150行约定","phase":1,"loop":"QA-finding","status":"backlog","priority":"P2","owner":"工程师","deps":["P1-1"],"notes":"可考虑将缓存逻辑拆到cacheService后自然解决"}
];

function load() {
  const tasks = TASKS;

  const done = tasks.filter(t => t.status === 'done');
  const backlog = tasks.filter(t => t.status === 'backlog');
  const qaItems = tasks.filter(t => t.loop === 'QA-finding' && t.status === 'backlog');
  const nonQaBacklog = backlog.filter(t => t.loop !== 'QA-finding');

  // Stats
  document.getElementById('stats').innerHTML = `
    <div class="stat done">✅ 已完成 ${done.length}</div>
    <div class="stat backlog">📋 待开发 ${nonQaBacklog.length}</div>
    <div class="stat qa">🔍 QA 发现 ${qaItems.length}</div>
  `;
  document.getElementById('done-count').textContent = done.length;
  const pct = Math.round((done.length / tasks.length) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';

  // Board
  const board = document.getElementById('board');

  // Done column
  board.innerHTML = renderColumn('✅ 已完成', 'done', done);

  // Backlog column (grouped by phase)
  const phases = {};
  nonQaBacklog.forEach(t => {
    const key = t.phase === 3 ? 'Phase 3: 闭环' : t.phase === 2 ? 'Phase 2: 规范化' : t.phase === 1 ? 'Phase 1: 抽离' : '基础';
    if (!phases[key]) phases[key] = [];
    phases[key].push(t);
  });

  let backlogHTML = '';
  for (const [phase, items] of Object.entries(phases)) {
    backlogHTML += `<div class="phase-section"><div class="phase-label">${phase} (${items.length})</div>`;
    backlogHTML += items.map(renderCard).join('');
    backlogHTML += '</div>';
  }
  board.innerHTML += `<div class="column"><div class="column-header"><div class="dot backlog"></div><h2>📋 待开发</h2><span class="count">${nonQaBacklog.length} 项</span></div>${backlogHTML}</div>`;

  // QA column
  board.innerHTML += `<div class="column"><div class="column-header"><div class="dot qa"></div><h2>🔍 QA 发现</h2><span class="count">${qaItems.length} 项</span></div>${qaItems.length ? qaItems.map(renderCard).join('') : '<div class="empty">暂无</div>'}</div>`;
}

function renderColumn(title, type, tasks) {
  let html = `<div class="column"><div class="column-header"><div class="dot ${type}"></div><h2>${title}</h2><span class="count">${tasks.length} 项</span></div>`;
  if (tasks.length === 0) { html += '<div class="empty">暂无</div>'; }
  else {
    const phases = {};
    tasks.forEach(t => {
      const key = t.phase === 0 ? 'Phase 0: 准备' : t.phase === 1 ? 'Phase 1: 抽离' : '基础';
      if (!phases[key]) phases[key] = [];
      phases[key].push(t);
    });
    for (const [phase, items] of Object.entries(phases)) {
      html += `<div class="phase-section"><div class="phase-label">${phase}</div>`;
      html += items.map(renderCard).join('');
      html += '</div>';
    }
  }
  html += '</div>';
  return html;
}

function renderCard(t) {
  const deps = t.deps && t.deps.length > 0
    ? `<div class="card-deps">依赖: ${t.deps.map(d => `<span>${d}</span>`).join('')}</div>`
    : '';
  return `<div class="card">
    <div class="card-header">
      <span class="badge ${t.priority}">${t.priority}</span>
      <span class="card-title">${t.id} ${t.title}</span>
    </div>
    <div class="card-meta">
      <span>👤 ${t.owner}</span>
      <span>📌 Loop ${t.loop}</span>
    </div>
    <div class="card-notes">${t.notes || ''}</div>
    ${deps}
  </div>`;
}

load();
</script>
</body>
</html>
